name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      # Public values (see .env.example); the build fails without them
      NEXT_PUBLIC_REGISTRY_ADDRESS: "0x6c03e1B8273F0Dd3A6d4d7E28B21d15Ad9e71802"
      NEXT_PUBLIC_TOKEN_ADDRESS: "0xC6a2fbCB19E29371a35Bf721559902843F6e09b0"
      NEXT_PUBLIC_REGISTRY_START_BLOCK: "3839041"
      NEXT_PUBLIC_NETWORK: hoodi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Contract tests
        run: npm test
      - name: API tests (in-memory store)
        run: npm run test:api
      - name: Slither static analysis
        run: |
          pip install slither-analyzer solc-select
          solc-select install 0.8.28
          solc-select use 0.8.28
          npx hardhat compile
          slither . --hardhat-ignore-compile
      - name: ABIs in Context/ match the contracts
        run: |
          node -e '
            for (const name of ["Registry", "NodeToken"]) {
              const a = require(`./artifacts/contracts/${name}.sol/${name}.json`).abi;
              const b = require(`./Context/${name}.json`).abi;
              if (JSON.stringify(a) !== JSON.stringify(b)) {
                console.error(`Context/${name}.json is stale: run npm run abi`);
                process.exit(1);
              }
            }'
      - run: npm run build
